name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore release keystore
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\stockmate.keystore", [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}"))

      - name: Publish signed APK
        shell: pwsh
        run: |
          dotnet restore .\StockMate\StockMate.csproj
          dotnet publish .\StockMate\StockMate.csproj -f net10.0-android -c Release -o .\artifacts\release --no-restore `
            -p:AndroidPackageFormats=apk `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:RUNNER_TEMP\stockmate.keystore" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Normalize APK filename
        shell: pwsh
        run: |
          $apk = Get-ChildItem .\artifacts\release -Filter "*-Signed.apk" -Recurse | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem .\artifacts\release -Filter "*.apk" -Recurse | Select-Object -First 1 }
          if (-not $apk) { throw "APK tidak ditemukan" }
          Copy-Item $apk.FullName .\artifacts\StockMate-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StockMate-APK
          path: artifacts/StockMate-release.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/StockMate-release.apk
